<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Manifest</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --fg: #1d1f21;
      --muted: #6b6f73;
      --line: #d7d9d6;
      --accent: #2266aa;
      --selected: #dfeaf5;
      --head: #ececea;
      --control: #ffffff;
      --control-line: #d7d9d6;
      --tag-bg: #e8edf2;
      --tag-line: #c8d0d8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101214;
        --fg: #f2f5f7;
        --muted: #c0c7ce;
        --line: #4c555d;
        --accent: #8fc7ff;
        --selected: #284766;
        --head: #252b31;
        --control: #161a1f;
        --control-line: #65717c;
        --tag-bg: #25313c;
        --tag-line: #596977;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header {
      display: grid;
      grid-template-columns: auto minmax(180px, 1fr) auto auto auto auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--head);
    }
    h1 {
      margin: 0 10px 0 0;
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
    }
    input, select, button {
      height: 28px;
      border: 1px solid var(--control-line);
      background: var(--control);
      color: var(--fg);
      font: inherit;
      border-radius: 4px;
    }
    input:focus, select:focus, button:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    input { width: 100%; min-width: 120px; padding: 0 8px; }
    select { padding: 0 6px; }
    button {
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .icon-button {
      width: 28px;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }
    .icon-button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    button:disabled {
      color: var(--muted);
      cursor: default;
      opacity: 0.65;
    }
    main {
      min-height: 0;
      overflow: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--head);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      user-select: none;
    }
    thead th[aria-sort="ascending"],
    thead th[aria-sort="descending"] {
      color: var(--fg);
    }
    .sort-icon {
      display: inline-block;
      width: 0;
      height: 0;
      margin-left: 5px;
      vertical-align: middle;
      opacity: 0;
    }
    thead th[aria-sort="ascending"] .sort-icon {
      opacity: 1;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 6px solid var(--accent);
    }
    thead th[aria-sort="descending"] .sort-icon {
      opacity: 1;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 6px solid var(--accent);
    }
    th, td {
      padding: 5px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tbody tr {
      cursor: default;
    }
    tbody tr:hover {
      background: color-mix(in srgb, var(--selected) 60%, transparent);
    }
    tbody tr.selected {
      background: var(--selected);
    }
    .title { width: 27%; }
    .authors { width: 18%; }
    .category { width: 7%; }
    .identifier { width: 14%; }
    .file { width: 12%; }
    .moved { width: 9%; }
    .tags { width: 17%; }
    .tags-cell {
      overflow: visible;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      align-items: center;
      min-height: 20px;
    }
    .tag-chip, .tag-add {
      height: 20px;
      border: 1px solid var(--tag-line);
      background: var(--tag-bg);
      color: var(--fg);
      border-radius: 4px;
      font-size: 12px;
      line-height: 18px;
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      max-width: 150px;
      overflow: hidden;
    }
    .tag-filter, .tag-remove {
      height: 18px;
      border: 0;
      background: transparent;
      color: inherit;
      border-radius: 0;
      font-size: 12px;
      line-height: 18px;
    }
    .tag-filter {
      min-width: 0;
      max-width: 126px;
      padding: 0 5px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tag-remove {
      width: 18px;
      padding: 0;
      border-left: 1px solid var(--tag-line);
      color: var(--muted);
    }
    .tag-filter:hover, .tag-remove:hover {
      background: var(--selected);
      color: var(--fg);
    }
    .tag-add {
      width: 22px;
      padding: 0;
    }
    .tag-menu {
      position: fixed;
      z-index: 10;
      width: 220px;
      border: 1px solid var(--control-line);
      background: var(--control);
      color: var(--fg);
      border-radius: 4px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
      padding: 6px;
    }
    .tag-menu[hidden] {
      display: none;
    }
    .tag-menu input {
      width: 100%;
      margin-bottom: 6px;
    }
    .tag-option {
      display: block;
      width: 100%;
      height: 24px;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 0 6px;
      color: var(--fg);
    }
    .tag-option:hover, .tag-option.active {
      background: var(--selected);
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .muted { color: var(--muted); }
    footer {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 5px 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: var(--head);
      min-height: 30px;
    }
    @media (max-width: 780px) {
      header {
        grid-template-columns: 1fr auto;
      }
      h1 { display: none; }
      #search { grid-column: 1 / -1; }
      .authors, .category, .moved { display: none; }
      .title { width: 38%; }
      .identifier { width: 22%; }
      .file { width: 20%; }
      .tags { width: 20%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Paper Manifest</h1>
      <input id="search" type="search" autocomplete="off" placeholder="Search title, authors, DOI, arXiv, file">
      <select id="viewer" aria-label="PDF viewer">
        <option value="default">System default</option>
        <option value="skim">Skim</option>
        <option value="preview">Preview</option>
        <option value="browser">Browser</option>
      </select>
      <button id="open" disabled>Open</button>
      <button id="refresh">Refresh</button>
      <button id="openManifest" class="icon-button" title="Open manifest.yaml" aria-label="Open manifest.yaml">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
          <path d="M14 3v5h5"/>
          <path d="M10 12l-2 2 2 2"/>
          <path d="M14 12l2 2-2 2"/>
        </svg>
      </button>
    </header>
    <main>
      <table>
        <thead>
          <tr>
            <th class="title" data-sort="title"><span>Title</span><span class="sort-icon" aria-hidden="true"></span></th>
            <th class="authors" data-sort="authors"><span>Authors</span><span class="sort-icon" aria-hidden="true"></span></th>
            <th class="category" data-sort="category"><span>Type</span><span class="sort-icon" aria-hidden="true"></span></th>
            <th class="identifier" data-sort="identifier"><span>ID</span><span class="sort-icon" aria-hidden="true"></span></th>
            <th class="file" data-sort="file"><span>File</span><span class="sort-icon" aria-hidden="true"></span></th>
            <th class="moved" data-sort="moved_at"><span>Moved</span><span class="sort-icon" aria-hidden="true"></span></th>
            <th class="tags" data-sort="tags_text"><span>Tags</span><span class="sort-icon" aria-hidden="true"></span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <footer>
      <span id="count">0 papers</span>
      <span id="status"></span>
    </footer>
  </div>
  <div id="tagMenu" class="tag-menu" hidden>
    <input id="tagInput" type="text" autocomplete="off" placeholder="Add tag">
    <div id="tagSuggestions"></div>
  </div>
  <script>
    const state = {
      papers: [],
      filtered: [],
      allTags: [],
      selectedId: null,
      activeTagPaperId: null,
      tagInputComposing: false,
      sortKey: 'moved_at',
      sortDir: 'desc'
    };

    const rows = document.getElementById('rows');
    const search = document.getElementById('search');
    const viewer = document.getElementById('viewer');
    const openButton = document.getElementById('open');
    const refreshButton = document.getElementById('refresh');
    const openManifestButton = document.getElementById('openManifest');
    const tagMenu = document.getElementById('tagMenu');
    const tagInput = document.getElementById('tagInput');
    const tagSuggestions = document.getElementById('tagSuggestions');
    const count = document.getElementById('count');
    const status = document.getElementById('status');

    function setStatus(text) {
      status.textContent = text || '';
    }

    function text(value) {
      return value == null ? '' : String(value);
    }

    function searchTerms() {
      return search.value.trim().toLowerCase().split(/[\s　]+/).filter(Boolean);
    }

    function matchPaper(paper, terms) {
      if (!terms.length) return true;
      return terms.some((term) => paper.search_text.includes(term));
    }

    function compareValues(a, b) {
      const av = text(a).toLowerCase();
      const bv = text(b).toLowerCase();
      if (av < bv) return -1;
      if (av > bv) return 1;
      return 0;
    }

    function applyFilterSort() {
      const terms = searchTerms();
      state.filtered = state.papers.filter((paper) => matchPaper(paper, terms));
      state.filtered.sort((a, b) => {
        const result = compareValues(a[state.sortKey], b[state.sortKey]);
        return state.sortDir === 'asc' ? result : -result;
      });
      render();
    }

    function render() {
      updateSortIndicators();
      rows.textContent = '';
      const frag = document.createDocumentFragment();
      for (const paper of state.filtered) {
        const tr = document.createElement('tr');
        tr.dataset.id = paper.id;
        if (paper.id === state.selectedId) tr.className = 'selected';
        tr.innerHTML = `
          <td class="title" title="${escapeAttr(paper.title)}">${escapeHtml(paper.title || '(untitled)')}</td>
          <td class="authors" title="${escapeAttr(paper.authors)}">${escapeHtml(paper.authors)}</td>
          <td class="category muted">${escapeHtml(paper.category)}</td>
          <td class="identifier mono" title="${escapeAttr(paper.identifier)}">${escapeHtml(paper.identifier)}</td>
          <td class="file mono" title="${escapeAttr(paper.file)}">${escapeHtml(paper.file)}</td>
          <td class="moved mono">${escapeHtml(shortDate(paper.moved_at))}</td>
          <td class="tags tags-cell">${tagsHtml(paper)}</td>
        `;
        tr.addEventListener('click', (event) => {
          if (event.target.closest('button, input, select')) return;
          selectPaper(paper.id);
        });
        tr.addEventListener('dblclick', (event) => {
          if (event.target.closest('button, input, select')) return;
          openSelected();
        });
        frag.appendChild(tr);
      }
      rows.appendChild(frag);
      const total = state.papers.length;
      const shown = state.filtered.length;
      count.textContent = `${shown} / ${total} papers`;
      openButton.disabled = !state.selectedId;
    }

    function updateSortIndicators() {
      document.querySelectorAll('th[data-sort]').forEach((th) => {
        if (th.dataset.sort === state.sortKey) {
          th.setAttribute('aria-sort', state.sortDir === 'asc' ? 'ascending' : 'descending');
        } else {
          th.removeAttribute('aria-sort');
        }
      });
    }

    function escapeHtml(value) {
      return text(value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function shortDate(value) {
      if (!value) return '';
      return value.replace('T', ' ').replace(/:\d\d([+-]\d\d:\d\d|Z)?$/, '');
    }

    function tagsHtml(paper) {
      const chips = (paper.tags || []).map((tag) => `
        <span class="tag-chip">
          <button type="button" class="tag-filter" data-action="filter-tag" data-tag="${escapeAttr(tag)}" title="Add ${escapeAttr(tag)} to search">${escapeHtml(tag)}</button>
          <button type="button" class="tag-remove" data-action="remove-tag" data-id="${escapeAttr(paper.id)}" data-tag="${escapeAttr(tag)}" title="Remove ${escapeAttr(tag)}" aria-label="Remove ${escapeAttr(tag)}">×</button>
        </span>
      `).join('');
      return `
        <div class="tag-list">
          ${chips}
          <button class="tag-add" data-action="add-tag" data-id="${escapeAttr(paper.id)}" title="Add tag" aria-label="Add tag">+</button>
        </div>
      `;
    }

    function selectPaper(id, scroll) {
      state.selectedId = id;
      render();
      if (scroll) {
        requestAnimationFrame(() => {
          const row = rows.querySelector(`tr[data-id="${CSS.escape(id)}"]`);
          if (row) row.scrollIntoView({block: 'nearest'});
        });
      }
    }

    function moveSelection(delta) {
      if (!state.filtered.length) return;
      if (document.activeElement === search) search.blur();
      let index = state.filtered.findIndex((paper) => paper.id === state.selectedId);
      if (index === -1) {
        index = delta > 0 ? 0 : state.filtered.length - 1;
      } else {
        index = Math.max(0, Math.min(state.filtered.length - 1, index + delta));
      }
      selectPaper(state.filtered[index].id, true);
    }

    function clearSelection() {
      if (!state.selectedId) return;
      state.selectedId = null;
      render();
    }

    function addTagToSearch(tag) {
      const normalized = text(tag).trim().replace(/\s+/g, ' ');
      if (!normalized) return;
      const terms = search.value.trim() ? search.value.trim().split(/[\s　]+/) : [];
      const existingTerms = new Set(terms.map((term) => term.toLowerCase()));
      const tagTerms = normalized.split(/[\s　]+/);
      const exists = tagTerms.every((term) => existingTerms.has(term.toLowerCase()));
      if (!exists) terms.push(normalized);
      search.value = terms.join(' ');
      state.selectedId = null;
      applyFilterSort();
      search.focus();
      search.setSelectionRange(search.value.length, search.value.length);
    }

    function isEditableTarget(target) {
      if (!target) return false;
      if (target.isContentEditable) return true;
      return ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName);
    }

    function paperById(id) {
      return state.papers.find((paper) => paper.id === id);
    }

    function openTagMenu(paperId, anchor) {
      state.activeTagPaperId = paperId;
      tagInput.value = '';
      renderTagSuggestions();
      const rect = anchor.getBoundingClientRect();
      tagMenu.hidden = false;
      const left = Math.min(rect.left, window.innerWidth - tagMenu.offsetWidth - 8);
      tagMenu.style.left = `${Math.max(8, left)}px`;
      tagMenu.style.top = `${Math.min(rect.bottom + 4, window.innerHeight - tagMenu.offsetHeight - 8)}px`;
      tagInput.focus();
    }

    function closeTagMenu() {
      state.activeTagPaperId = null;
      tagMenu.hidden = true;
    }

    function renderTagSuggestions() {
      const paper = paperById(state.activeTagPaperId);
      if (!paper) {
        tagSuggestions.textContent = '';
        return;
      }
      const current = new Set((paper.tags || []).map((tag) => tag.toLowerCase()));
      const query = tagInput.value.trim().toLowerCase();
      const options = state.allTags
        .filter((tag) => !current.has(tag.toLowerCase()))
        .filter((tag) => !query || tag.toLowerCase().includes(query))
        .slice(0, 8);

      tagSuggestions.textContent = '';
      const frag = document.createDocumentFragment();
      if (tagInput.value.trim() && !state.allTags.some((tag) => tag.toLowerCase() === query)) {
        frag.appendChild(tagOption(`Create "${tagInput.value.trim()}"`, tagInput.value.trim()));
      }
      for (const tag of options) {
        frag.appendChild(tagOption(tag, tag));
      }
      tagSuggestions.appendChild(frag);
    }

    function tagOption(label, tag) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tag-option';
      button.textContent = label;
      button.dataset.tag = tag;
      button.addEventListener('click', () => addTag(state.activeTagPaperId, tag));
      return button;
    }

    async function saveTags(paperId, tags) {
      const res = await fetch('/api/tags', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id: paperId, tags})
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        setStatus(data.error || 'Could not save tags');
        return false;
      }
      setStatus('Saved tags');
      await loadPapers();
      return true;
    }

    async function addTag(paperId, tag) {
      const paper = paperById(paperId);
      if (!paper) return;
      const normalized = tag.trim().replace(/\s+/g, ' ');
      if (!normalized) return;
      const exists = (paper.tags || []).some((existing) => existing.toLowerCase() === normalized.toLowerCase());
      if (exists) {
        closeTagMenu();
        return;
      }
      await saveTags(paperId, [...(paper.tags || []), normalized]);
      closeTagMenu();
    }

    async function removeTag(paperId, tag) {
      const paper = paperById(paperId);
      if (!paper) return;
      const nextTags = (paper.tags || []).filter((existing) => existing !== tag);
      await saveTags(paperId, nextTags);
    }

    async function loadConfig() {
      const res = await fetch('/api/config');
      if (!res.ok) throw new Error('Could not load config');
      const config = await res.json();
      viewer.value = config.viewer || 'default';
    }

    async function saveConfig() {
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({viewer: viewer.value})
      });
      if (!res.ok) setStatus('Could not save viewer preference');
    }

    async function loadPapers() {
      setStatus('Loading...');
      const res = await fetch('/api/papers');
      if (!res.ok) throw new Error('Could not load manifest');
      const data = await res.json();
      state.papers = data.papers || [];
      state.allTags = data.tags || [];
      if (!state.papers.some((paper) => paper.id === state.selectedId)) {
        state.selectedId = null;
      }
      applyFilterSort();
      setStatus(data.manifest || '');
    }

    async function openSelected() {
      if (!state.selectedId) return;
      const res = await fetch('/api/open', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id: state.selectedId, viewer: viewer.value})
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        setStatus(data.error || 'Open failed');
        return;
      }
      if (data.url) {
        window.open(data.url, '_blank', 'noopener');
      }
      setStatus('Opened');
    }

    async function openManifest() {
      const res = await fetch('/api/open-manifest', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: '{}'
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        setStatus(data.error || 'Could not open manifest');
        return;
      }
      setStatus('Opened manifest');
    }

    search.addEventListener('input', () => {
      state.selectedId = null;
      applyFilterSort();
    });
    viewer.addEventListener('change', saveConfig);
    openButton.addEventListener('click', openSelected);
    refreshButton.addEventListener('click', loadPapers);
    openManifestButton.addEventListener('click', openManifest);
    rows.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      event.stopPropagation();
      const action = button.dataset.action;
      if (action === 'add-tag') openTagMenu(button.dataset.id, button);
      if (action === 'filter-tag') addTagToSearch(button.dataset.tag);
      if (action === 'remove-tag') removeTag(button.dataset.id, button.dataset.tag);
    });
    tagInput.addEventListener('input', renderTagSuggestions);
    tagInput.addEventListener('compositionstart', () => {
      state.tagInputComposing = true;
    });
    tagInput.addEventListener('compositionend', () => {
      state.tagInputComposing = false;
      renderTagSuggestions();
    });
    tagInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        if (event.isComposing || state.tagInputComposing) return;
        event.preventDefault();
        const first = tagSuggestions.querySelector('.tag-option');
        if (first) addTag(state.activeTagPaperId, first.dataset.tag);
        else addTag(state.activeTagPaperId, tagInput.value);
      }
      if (event.key === 'Escape') {
        event.preventDefault();
        closeTagMenu();
      }
    });
    document.addEventListener('click', (event) => {
      if (tagMenu.hidden) return;
      if (tagMenu.contains(event.target)) return;
      if (event.target.closest('button[data-action="add-tag"]')) return;
      closeTagMenu();
    });
    document.querySelectorAll('th[data-sort]').forEach((th) => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (state.sortKey === key) {
          state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          state.sortKey = key;
          state.sortDir = key === 'moved_at' ? 'desc' : 'asc';
        }
        applyFilterSort();
      });
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === '/' && !event.metaKey && !event.ctrlKey && !event.altKey && !isEditableTarget(event.target)) {
        event.preventDefault();
        search.focus();
        search.select();
        return;
      }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        if (event.target === viewer) return;
        event.preventDefault();
        moveSelection(event.key === 'ArrowDown' ? 1 : -1);
        return;
      }
      if (event.key === 'Enter' && state.selectedId && !isEditableTarget(event.target) && event.target.tagName !== 'BUTTON') {
        event.preventDefault();
        openSelected();
        return;
      }
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'r') {
        event.preventDefault();
        loadPapers();
      }
    });

    Promise.all([loadConfig(), loadPapers()]).catch((error) => setStatus(error.message));
  </script>
</body>
</html>
